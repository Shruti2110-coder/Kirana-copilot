<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161615">
<title>Offline · Hisaab Kitaab</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfbfa; --ink: #161615; --muted: #74746f; --line: #e6e6e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111110; --ink: #ededeb; --muted: #8f8f8a; --line: #2a2a28; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.55 "IBM Plex Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  .hi { padding-top: 14px; border-top: 1px solid var(--line); }
  button { justify-self: start; min-height: 42px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#161615"/><path d="M10 19.5c7.5-2.6 15-2 22 2.5v26c-7-4-14.5-4.6-22-2.5z" fill="#fbfbfa" fill-opacity=".86"/><path d="M54 19.5c-7.5-2.6-15-2-22 2.5v26c7-4 14.5-4.6 22-2.5z" fill="#fbfbfa"/><path d="M36.5 27h8M36.5 30.8h8M37.4 27h2.3a3.8 3.8 0 0 1 0 7.6h-2.3l6.4 7" stroke="#161615" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M48.6 18.7v8.3l1.9-1.5 1.9 1.5v-8.9c-1.3-.1-2.5 0-3.8.6z" fill="#c42b1c"/></svg>
  <h1>You're offline</h1>
  <p>Hisaab Kitaab needs the internet to open your khata. Your entries are safe. Try again when you're connected.</p>
  <p class="hi" lang="hi">आप ऑफ़लाइन हैं। खाता खोलने के लिए इंटरनेट चाहिए। आपकी एंट्रियाँ सुरक्षित हैं।</p>
  <button onclick="location.reload()">Try again · फिर कोशिश करें</button>
</main>
</body>
</html>
